name: Instagram Scheduled Posts

# Refatorado 27/07/2026 apos falha silenciosa de 06-07/2026.
#
# Design a prova de atraso:
#   - Cron DIARIO (nao datas absolutas) - se um cron falha, o proximo tenta
#   - Fila automatica via next_post.py - identifica proximo post nao-publicado
#     via Graph API + comparacao de caption prefix
#   - Rate-limit prudente - so 1 post por 20h de janela
#   - Retry via 2 disparos diarios (18h + 21h BRT)
#   - Notificacao via webhook opcional (Discord/Slack) SE NOTIFY_WEBHOOK_URL configurado
#
# Salvaguardas (ver docs/editorial/SALVAGUARDAS.md):
#   Camada 0: Concurrency lock (impede execucoes paralelas)
#   Camada 1: Pre-flight (token, URLs, caption, JSON)
#   Camada 2: Idempotencia via next_post.py (compara Graph API)
#   Camada 3: Retry exponencial no post_to_instagram.py
#   Camada 4: Backup diario as 21:00 UTC (segunda tentativa)
#   Camada 5: Webhook notif em falha (chega no telefone do usuario)
#   Camada 6: Issue automatica no repo (backup textual)
#
# IMPORTANTE: apos falha silenciosa jul/2026, o Gabriel EXIGE que qualquer
# Claude que entrar no projeto Renegocia CHEQUE as issues abertas do repo
# ANTES de qualquer coisa. Ver ~/.claude/projects/-Users-mac/memory/renegocia-instagram-monitoring.md

on:
  schedule:
    # Publicacao principal 18:00 BRT (21:00 UTC) todo dia util
    - cron: '0 21 * * 1'   # Seg 18h BRT
    - cron: '0 21 * * 2'   # Ter 18h BRT
    - cron: '0 21 * * 3'   # Qua 18h BRT
    - cron: '0 21 * * 4'   # Qui 18h BRT
    - cron: '0 21 * * 5'   # Sex 18h BRT
    # Backup 21:00 BRT (00:00 UTC dia seguinte) se principal falhou
    - cron: '0 0 * * 2'    # Ter madrugada UTC = seg noite BRT
    - cron: '0 0 * * 3'
    - cron: '0 0 * * 4'
    - cron: '0 0 * * 5'
    - cron: '0 0 * * 6'
  workflow_dispatch:
    inputs:
      post_number:
        description: 'Numero especifico do post (em branco = usa fila automatica)'
        required: false
        default: ''
      dry_run:
        description: 'Dry-run (nao publica, so simula)'
        required: false
        default: 'false'
      force:
        description: 'Force: ignora rate-limit de 20h (publica mesmo se ja saiu hoje)'
        required: false
        default: 'false'

concurrency:
  group: ig-post
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decidir proximo post via fila automatica
        id: decide
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID:      ${{ secrets.IG_USER_ID }}
          INPUT_POST_NUMBER: ${{ github.event.inputs.post_number }}
          INPUT_FORCE:      ${{ github.event.inputs.force }}
        run: |
          set +e
          if [ -n "$INPUT_POST_NUMBER" ]; then
            echo "Post especificado via dispatch: $INPUT_POST_NUMBER"
            echo "post_number=$INPUT_POST_NUMBER" >> $GITHUB_OUTPUT
            echo "skip_reason=" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "$INPUT_FORCE" = "true" ]; then
            python3 scripts/next_post.py --gha --allow-same-day
          else
            python3 scripts/next_post.py --gha
          fi
          rc=$?
          if [ $rc -eq 2 ]; then
            echo "FILA VAZIA - todos os posts do JSON ja foram publicados"
            echo "skip_reason=fila_vazia" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ $rc -eq 3 ]; then
            echo "SKIP - ja publicou nas ultimas 20h"
            echo "skip_reason=ja_publicou_hoje" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ $rc -ne 0 ]; then
            echo "FATAL - erro no next_post.py (exit $rc)"
            exit $rc
          fi

      - name: Pre-flight
        if: steps.decide.outputs.post_number != ''
        env:
          IG_ACCESS_TOKEN:   ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID:        ${{ secrets.IG_USER_ID }}
          IG_IMAGE_BASE_URL: ${{ secrets.IG_IMAGE_BASE_URL }}
          POST_NUM:          ${{ steps.decide.outputs.post_number }}
        run: |
          set +e
          python3 scripts/preflight.py "$POST_NUM"
          rc=$?
          if [ $rc -eq 0 ] || [ $rc -eq 2 ]; then
            echo "preflight: OK ou AVISO"
            exit 0
          fi
          echo "preflight: FATAL (exit $rc)"
          exit $rc

      - name: Publicar post
        id: publish
        if: steps.decide.outputs.post_number != ''
        env:
          IG_ACCESS_TOKEN:   ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID:        ${{ secrets.IG_USER_ID }}
          IG_IMAGE_BASE_URL: ${{ secrets.IG_IMAGE_BASE_URL }}
          POST_NUM:          ${{ steps.decide.outputs.post_number }}
          DRY_RUN:           ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "=== DRY-RUN Post $POST_NUM ==="
            python3 scripts/post_to_instagram.py "$POST_NUM"
          else
            echo "=== Publicando Post $POST_NUM ==="
            python3 scripts/post_to_instagram.py "$POST_NUM" --publish
          fi

      - name: Notificar webhook externo em falha
        if: failure()
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          POST_NUM: ${{ steps.decide.outputs.post_number }}
        run: |
          if [ -z "$NOTIFY_WEBHOOK_URL" ]; then
            echo "NOTIFY_WEBHOOK_URL nao configurado - pulando notificacao externa"
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MSG="🚨 FALHA IG @renegocia.tributario - Post ${POST_NUM:-?} nao publicou. Ver: ${RUN_URL}"
          # Formato compativel com Discord/Slack incoming webhook
          curl -sSL -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"${MSG}\",\"text\":\"${MSG}\"}" \
            "$NOTIFY_WEBHOOK_URL" || echo "webhook falhou (nao bloqueia)"

      - name: Issue automatica em falha (backup textual)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const postNum = '${{ steps.decide.outputs.post_number }}' || '?';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[FALHA-IG] ${new Date().toISOString()} post ${postNum}`,
              body: `Workflow falhou em publicar post ${postNum}.\n\n**Run:** ${runUrl}\n\nVerificar step com X vermelho.`,
              labels: ['ig-falha', 'urgente'],
            });
